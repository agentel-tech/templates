name: Split submission native Ubuntu CI

# Validation only: each job checks out an exact submission commit.
on:
  push:
    branches: [ci/split-candidates-20261016]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-defaults:
    name: ${{ matrix.candidate }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: template-only
            sha: 8a29d25f75ce513dbe5ebc2238b5c216a0d7a1ef
          - candidate: grpc-only
            sha: 49c6ecc0f3dc8e6e5a507f95de466f0aee576e8f
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: pnpm
      - name: Verify native architecture
        run: |
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          git rev-parse HEAD
          node --version
          pnpm --version
          docker info --format '{{.OSType}} {{.Architecture}}'
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=10
      - name: Run checks
        run: pnpm -w check
      - name: Run default concurrency unit tests
        run: pnpm -w test
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run all E2E with default functional configuration
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-default-report.json
        run: pnpm test:e2e --reporter=line,json
      - name: Retain readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.candidate }}-results
          path: |
            e2e-default-report.json
            test-results/
            .turbo/runs/
